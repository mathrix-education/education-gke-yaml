apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: dev.mathrix.fr-certificate
  namespace: default
spec:
  secretName: dev.mathrix.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: dev.mathrix.fr
  dnsNames:
  - dev.mathrix.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - dev.mathrix.fr
---
