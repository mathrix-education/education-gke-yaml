apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-redoc
    environment: dev
    tier: doc
  name: dev-education-api-redoc-ingress
  namespace: default
spec:
  rules:
  - host: dev.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: dev-education-api-redoc-service
          servicePort: 8080
        path: /docs/?(.*)
      - backend:
          serviceName: dev-education-api-redoc-service
          servicePort: 8080
        path: /docs
  tls:
  - hosts:
    - dev.mathrix.fr
    secretName: dev.mathrix.fr-secret

