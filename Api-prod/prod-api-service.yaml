apiVersion: v1
kind: Service
metadata:
  labels:
    app: education-api
    environment: prod
    tier: backend
  name: prod-education-api-service
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: education-api
    environment: prod
    tier: backend
  sessionAffinity: None
  type: NodePort


