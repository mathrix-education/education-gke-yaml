apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api
    environment: master
    tier: backend
  name: prod-education-api-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 2
  selector:
    matchLabels:
      app: education-api
      environment: master
      tier: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api
        environment: master
        tier: backend
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: master
        - name: APP_DEBUG
          value: "false"
        - name: APP_TIMEZONE
          value: Europe/Paris
        - name: APP_WEBROOT
          value: https://prod.mathrix.fr
        - name: APP_API
          value: https://mathrix.fr/api
        - name: APP_CDN
          value: https://cdn.mathrix.fr
        - name: CACHE_DRIVER
          value: database
        - name: CACHE_PREFIX
        - name: QUEUE_DRIVER
          value: sync
        - name: DB_CONNECTION
          value: mysql
        - name: DB_HOST
          value: 10.98.80.3
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: master_mathrix_education
        - name: DB_USERNAME
          value: master-education
        - name: GOOGLE_CLOUD_STORAGE_BUCKET
          value: cdn.mathrix.fr
        - name: SENTRY_DSN
          value: https://9df8f86886e5414987f68d2096adbc2c@sentry.mathrix.fr/2
        - name: MAILGUN_DOMAIN
          value: mathrix.fr
        - name: BRAINTREE_ENVIRONMENT
          value: production
        - name: BRAINTREE_MERCHANT_ID
          value: rzyffphs7hk49gnj
        - name: BRAINTREE_MERCHANT_ACCOUNT
          value: mathrixEUR
        - name: BRAINTREE_PUBLIC_KEY
          value: ry6q5p8fbjkjrzfr
        - name: ANALYTICS_ID
          value: UA-62513242-7
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              key: APP_KEY_MASTER
              name: app-key-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD_MASTER
              name: db-password-secret
        - name: SLACK_WEBHOOK_SUPERVISOR
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_SUPERVISOR_MASTER
              name: slack-webhook-supervisor-secret
        - name: SLACK_WEBHOOK_PREMIUM
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_PREMIUM_MASTER
              name: slack-webhook-premium-secret
        - name: MAILGUN_SECRET
          valueFrom:
            secretKeyRef:
              key: MAILGUN_SECRET_MASTER
              name: mailgun-secret-secret
        - name: STRIPE_SECRET
          valueFrom:
            secretKeyRef:
              key: STRIPE_SECRET_MASTER
              name: stripe-secret-secret
        - name: BRAINTREE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: BRAINTREE_PRIVATE_KEY_MASTER
              name: braintree-private-key-secret
        image: eu.gcr.io/mathrix-education/education-api:38c9557
        imagePullPolicy: IfNotPresent
        name: master-education-api
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10

