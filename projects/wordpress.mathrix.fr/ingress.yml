apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-wordpress
    environment: dev
    tier: wp
  name: wordpress-ingress
  namespace: default
spec:
  rules:
    - host: wordpress.mathrix.fr
      http:
        paths:
          - backend:
              serviceName: wordpress-service
              servicePort: 80
            path: /
  tls:
    - hosts:
        - wordpress.mathrix.fr
      secretName: wordpress.mathrix.fr-secret