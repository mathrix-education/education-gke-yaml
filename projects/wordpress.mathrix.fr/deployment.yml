apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: education-wordpress
    environment: dev
    tier: wp
spec:
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: education-wordpress
        environment: dev
        tier: wp
    spec:
      containers:
        - image: buddy/wordpress:latest
          name: wordpress
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST
                  name: dev-wp-env-configmap
            - name: WORDPRESS_DB_USER
              valueFrom:
                configMapKeyRef:
                  key: DB_USER
                  name: dev-wp-env-configmap
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wp-env-secret
                  key: DB_PASSWORD

          ports:
            - containerPort: 80
              name: wordpress
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wordpress-persistent-volume-claim