apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /system/sitemap
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-api
    environment: dev
    tier: backend
  name: dev-sitemap-ingress
  namespace: default
spec:
  rules:
  - host: dev.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: dev-education-api-service
          servicePort: 80
        path: /sitemap.xml
  tls:
  - hosts:
    - dev.mathrix.fr
    secretName: dev.mathrix.fr-secret
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-api
    environment: dev
    tier: backend
  name: dev-education-api-ingress
  namespace: default
spec:
  rules:
  - host: dev.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: dev-education-api-service
          servicePort: 80
        path: /api/?(.*)
  tls:
  - hosts:
    - dev.mathrix.fr
    secretName: dev.mathrix.fr-secret
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: "/dev.cdn.mathrix.fr/$1"
    nginx.ingress.kubernetes.io/upstream-vhost: "storage.googleapis.com"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-cdn
    environment: dev
    tier: backend
  name: dev-cdn-domain-ingress
  namespace: default
spec:
  rules:
  - host: dev.cdn.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: dev-education-cdn-service
          servicePort: 80
        path: /?(.*)
  tls:
  - hosts:
    - dev.cdn.mathrix.fr
    secretName: dev.cdn.mathrix.fr-secret





