apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api
    environment: master
    tier: backend
    type: worker
  name: master-education-api-worker-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 8
  selector:
    matchLabels:
      app: education-api
      environment: master
      tier: backend
      type: worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api
        environment: master
        tier: backend
        type: worker
    spec:
      containers:
      - name: worker
        image: eu.gcr.io/mathrix-education/education-api:latest-master
        imagePullPolicy: Always
        args: [worker]
        envFrom:
        - configMapRef: 
            name: master-api-env-configmap
        - secretRef:
            name: master-env-secret
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: master-cdn-keychain
          mountPath: /var/www/storage/keychain
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
      - name: master-cdn-keychain
        secret:
          secretName: master-education-keychain
