apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api
    environment: master
    tier: backend
    type: scheduler
  name: master-education-api-scheduler-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: education-api
      environment: master
      tier: backend
      type: scheduler
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api
        environment: master
        tier: backend
        type: scheduler
    spec:
      containers:
      - envFrom:
        - configMapRef: 
            name: master-api-env-configmap
        - secretRef:
            name: master-env-secret
        image: eu.gcr.io/mathrix-education/education-api:latest-master
        imagePullPolicy: IfNotPresent
        args:
        - scheduler
        name: master-education-api
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: master-cdn-keychain
          mountPath: /var/www/storage/keychain
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
      - name: master-cdn-keychain
        secret:
          secretName: master-education-keychain
