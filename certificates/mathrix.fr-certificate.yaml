apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: mathrix.fr-certificate
  namespace: default
spec:
  secretName: mathrix.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: mathrix.fr
  dnsNames:
  - mathrix.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - mathrix.fr
