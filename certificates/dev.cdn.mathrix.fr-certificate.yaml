apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: dev.cdn.mathrix.fr-certificate
  namespace: default
spec:
  secretName: dev.cdn.mathrix.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: dev.cdn.mathrix.fr
  dnsNames:
  - dev.cdn.mathrix.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - dev.cdn.mathrix.fr