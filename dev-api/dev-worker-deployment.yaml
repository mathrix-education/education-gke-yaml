apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api-worker
    environment: dev
    tier: backend
  name: dev-education-api-worker-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: education-api-worker
      environment: dev
      tier: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api-worker
        environment: dev
        tier: backend
    spec:
      containers:
      - envFrom:
        - configMapRef: 
            name: dev-api-env-configmap
        - secretRef:
            name: dev-env-secret
        image: eu.gcr.io/mathrix-education/education-api:latest-dev
        imagePullPolicy: IfNotPresent
        command: ["php"]
        args: ["artisan","queue:work"]
        name: worker
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: dev-cdn-keychain
          mountPath: /var/www/storage/keychain
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dev-cdn-keychain
          secret:
            secretName: dev-education-keychain
