apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-api
    environment: master
    tier: backend
  name: master-education-api-ingress
  namespace: default
spec:
  rules:
  - host: prod.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-api-service
          servicePort: 80
        path: /api/?(.*)
  tls:
  - hosts:
    - prod.mathrix.fr
    secretName: prod.mathrix.fr-secret
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/rewrite-target: /cdn/$1
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
  labels:
    app: education-api
    environment: master
    tier: backend
  name: master-education-cdn-ingress
  namespace: default
spec:
  rules:
  - host: cdn.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-api-service
          servicePort: 80
        path: /?(.*)
  tls:
  - hosts:
    - cdn.mathrix.fr
    secretName: cdn.mathrix.fr-secret

