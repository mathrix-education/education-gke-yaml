apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: education-angular
    environment: master
    tier: backend
  name: master-education-angular-ingress
  namespace: default
spec:
  rules:
  - host: mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-angular-service
          servicePort: 8081
        path: /
  tls:
  - hosts:
    - mathrix.fr
    secretName: mathrix.fr-secret


