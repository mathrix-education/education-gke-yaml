apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-angular
    environment: dev
    tier: frontend
  name: dev-education-angular-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 2
  selector:
    matchLabels:
      app: education-angular
      environment: dev
      tier: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: education-angular
        environment: dev
        tier: frontend
    spec:
      containers:
      - image: eu.gcr.io/mathrix-education/education-angular:bee7901
        imagePullPolicy: IfNotPresent
        name: dev-education-angular
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10

