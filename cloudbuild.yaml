substitutions:
  _COMPUTE_ZONE: 'europe-west1-b'
  _CLUSTER: 'mathrix-education-cluster'
steps:
  - id: 'kubectl:apply'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: '/bin/bash'
    args:
      - '-c'
      - |
        gcloud config set project $PROJECT_ID
        gcloud container clusters get-credentials --zone "$_COMPUTE_ZONE" "$_CLUSTER"
        kubectl apply -f certificates --recursive | configured
        kubectl apply -f nginx-ingress --recursive | configured
        kubectl apply -f projects --recursive | configured
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLUSTER'
