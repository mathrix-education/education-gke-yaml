steps:
  - id: 'kubectl:apply'
    name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: '/bin/bash'
    args:
      - '-c'
      - |
        gcloud auth login
        gcloud config set project $PROJECT_ID
        kubectl apply -f certificates --recursive
        kubectl apply -f nginx-ingress --recursive
        kubectl apply -f projects --recursive
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=europe-west1-b'
      - 'CLOUDSDK_CONTAINER_CLUSTER=mathrix-education-cluster'
