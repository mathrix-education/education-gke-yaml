apiVersion: v1
kind: Service
metadata:
  labels:
    app: education-api
    environment: master
    tier: backend
  name: master-education-api-service
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: education-api
    environment: master
    tier: backend
  sessionAffinity: None
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: education-cdn
    environment: master
    tier: backend
  name: master-education-cdn-service
spec:
  externalName: storage.googleapis.com
  type: ExternalName
