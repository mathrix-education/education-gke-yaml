apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /system/sitemap
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: education-api
    environment: master
    tier: backend
  name: master-sitemap-ingress
  namespace: default
spec:
  rules:
  - host: mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-api-service
          servicePort: 80
        path: /sitemap.xml
  tls:
  - hosts:
    - mathrix.fr
    secretName: mathrix.fr-secret
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: education-api
    environment: master
    tier: backend
  name: master-education-api-ingress
  namespace: default
spec:
  rules:
  - host: mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-api-service
          servicePort: 80
        path: /api/?(.*)
  tls:
  - hosts:
    - mathrix.fr
    secretName: mathrix.fr-secret
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: "/cdn.mathrix.fr/$1"
    nginx.ingress.kubernetes.io/upstream-vhost: "storage.googleapis.com"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: education-api
    environment: master
    tier: backend
  name: cdn-domain-ingress
  namespace: default
spec:
  rules:
  - host: cdn.mathrix.fr
    http:
      paths:
      - backend:
          serviceName: master-education-cdn-service
          servicePort: 80
        path: /?(.*)
  tls:
  - hosts:
    - cdn.mathrix.fr
    secretName: cdn.mathrix.fr-secret




