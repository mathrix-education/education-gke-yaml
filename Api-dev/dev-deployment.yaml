apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api
    environment: dev
    tier: backend
  name: dev-education-api-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 2
  selector:
    matchLabels:
      app: education-api
      environment: dev
      tier: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api
        environment: dev
        tier: backend
    spec:
      containers:
      - env:
        - name: APP_ENV
          value: dev
        - name: APP_DEBUG
          value: "true"
        - name: APP_TIMEZONE
          value: Europe/Paris
        - name: CACHE_DRIVER
          value: database
        - name: QUEUE_DRIVER
          value: sync
        - name: APP_WEBROOT
          value: https://dev.mathrix.fr
        - name: APP_API
          value: https://dev.mathrix.fr/api
        - name: APP_CDN
          value: https://dev.cdn.mathrix.fr
        - name: DB_CONNECTION
          value: mysql
        - name: DB_HOST
          value: 10.98.80.3
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: dev_mathrix_education
        - name: DB_USERNAME
          value: dev-education
        - name: GOOGLE_CLOUD_STORAGE_BUCKET
          value: dev.cdn.mathrix.fr
        - name: SENTRY_DSN
          value: https://9df8f86886e5414987f68d2096adbc2c@sentry.mathrix.fr/2
        - name: MAILGUN_DOMAIN
          value: sandbox0aa19ceedf694eff93133d0650048b38.mailgun.org
        - name: BRAINTREE_ENVIRONMENT
          value: sandbox
        - name: BRAINTREE_MERCHANT_ID
          value: 7mjzzwmq2thkzy42
        - name: BRAINTREE_MERCHANT_ACCOUNT
          value: mathrixeducationsa
        - name: BRAINTREE_PUBLIC_KEY
          value: 3ddb9n3w722b377d
        - name: ANALYTICS_ID
          value: UA-62513242-5
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              key: APP_KEY_DEV
              name: app-key-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD_DEV
              name: db-password-secret
        - name: SLACK_WEBHOOK_SUPERVISOR
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_SUPERVISOR_DEV
              name: slack-webhook-supervisor-secret
        - name: SLACK_WEBHOOK_PREMIUM
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_PREMIUM_DEV
              name: slack-webhook-premium-secret
        - name: MAILGUN_SECRET
          valueFrom:
            secretKeyRef:
              key: MAILGUN_SECRET_DEV
              name: mailgun-secret-secret
        - name: STRIPE_SECRET
          valueFrom:
            secretKeyRef:
              key: STRIPE_SECRET_DEV
              name: stripe-secret-secret
        - name: BRAINTREE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: BRAINTREE_PRIVATE_KEY_DEV
              name: braintree-private-key-secret
        image: eu.gcr.io/mathrix-education/education-api:008bd35
        imagePullPolicy: IfNotPresent
        name: dev-education-api
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: dev-cdn-key
          mountPath: /var/www/storage/google-cloud-storage
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dev-cdn-key
          configMap:
            name: dev-education-cdn-key
