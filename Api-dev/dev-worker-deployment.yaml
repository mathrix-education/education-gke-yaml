apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: education-api-worker
    environment: dev
    tier: backend
  name: dev-education-api-worker-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: education-api-worker
      environment: dev
      tier: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: education-api-worker
        environment: dev
        tier: backend
    spec:
      containers:
      - envFrom:
        - configMapRef: 
            name: dev-api-env-configmap
        env:
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              key: APP_KEY_DEV
              name: app-key-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD_DEV
              name: db-password-secret
        - name: SLACK_WEBHOOK_SUPERVISOR
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_SUPERVISOR_DEV
              name: slack-webhook-supervisor-secret
        - name: SLACK_WEBHOOK_PREMIUM
          valueFrom:
            secretKeyRef:
              key: SLACK_WEBHOOK_PREMIUM_DEV
              name: slack-webhook-premium-secret
        - name: MAILGUN_SECRET
          valueFrom:
            secretKeyRef:
              key: MAILGUN_SECRET_DEV
              name: mailgun-secret-secret
        - name: STRIPE_SECRET
          valueFrom:
            secretKeyRef:
              key: STRIPE_SECRET_DEV
              name: stripe-secret-secret
        - name: BRAINTREE_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: BRAINTREE_PRIVATE_KEY_DEV
              name: braintree-private-key-secret
        image: eu.gcr.io/mathrix-education/education-api:latest-dev
        imagePullPolicy: IfNotPresent
        command: ["php"]
        args: ["artisan","queue:work"]
        name: worker
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: dev-cdn-keychain
          mountPath: /var/www/storage/keychain
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dev-cdn-keychain
          secret:
            secretName: dev-education-keychain
